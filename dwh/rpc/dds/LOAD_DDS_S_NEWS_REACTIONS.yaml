input:
  redpanda:
    seed_brokers: ["dwh-rp-1:9092"]
    topics: ["news_translated"]
    consumer_group: "LOAD_DDS_S_NEWS_REACTIONS"

pipeline:
  threads: 1
  processors:
    - label: decode
      schema_registry_decode:
        url: "http://dwh-rp-1:8081"
    - catch:
        - log:
            level: ERROR
            message: "Error decoding avro: ${! error() }"
        - mapping: 'root = deleted()'

    # Оставляем только новости на английском языке
    - mapping: |
        root = if this.language_code != "en" { deleted() } else { this }

    # Проверка в кэше: анализировалась ли эта новость ранее
    - branch:
        processors:
          - try:
              - label: redis_check
                cache:
                  resource: redis_cache
                  operator: exists
                  key: "processed:dds.s_news_reactions:${! this.news_link.string() }"
        result_map: 'meta is_processed = content().string().catch("false")'

    # Если новость уже была обработана, удаляем ее из потока
    - mapping: |
        root = if meta("is_processed") == "true" { deleted() } else { this }

    # Обращение к LLM для извлечения тикеров и оценок
    - branch:
        request_map: |
          let system_instruction = """
            You are an expert media analyst and risk assessment specialist.
            Your task is to conduct a deep analysis of the provided news article, evaluate its potential impact across several metrics, and return structured data in JSON format.

            **Important: You must return a JSON object with the following fields:**
            - reach_idx (string) — exponential estimate of the number of people affected by the news.
              MUST be EXACTLY one of: "1k", "10k", "100k", "1m", "10m", "100m", "1b", "10b"
              Do NOT use bare numbers (e.g. "1", "1000"), other units, or any value outside this list.
            - impact_scr (integer) — strength of the news impact on one person's life (1 — noise, 100 — fundamental changes)
            - duration_days (integer) — projected duration of the news effect in days (1, 7, 30, 90, 180, 365, 3650, 36500)
            - geoscale_nm (string) — geographic scope.
              MUST be EXACTLY one of: "local", "national", "regional", "global"
              * "local" — local impact (city, state, region)
              * "national" — impact within a single country
              * "regional" — impact across multiple countries in one region (e.g., Europe, Middle East)
              * "global" — impact on the entire world
              Do NOT use any value outside this list.
            - confidence_prt (float) — from 0.00 to 1.00. For events that have already occurred = 1.00
            - reason_txt (string) — brief explanation in Russian

            Confidence (confidence_prt) must reflect the probability of the event occurring (if it has not yet happened).
            Use the range from 0.00 to 1.00 with two decimal places.
            For events that have already occurred, use confidence_prt = 1.00.

            Write reason_txt in Russian only.
          """

          let prompt_text = """
            News:
            Title: """ + this.title_txt.or("") + """
            Summary: """ + this.summary_txt.or("") + """

            Task:
            Analyze the news and return a JSON object.

            Your response (JSON only, no explanations):
          """

          root = {
            "model": "deepseek-v4-flash",
            "stream": false,
            "temperature": 0.0,
            "top_p": 0.1,
            "response_format": { "type": "json_object" },
            "messages": [
              { "role": "system", "content": $system_instruction },
              { "role": "user",   "content": $prompt_text }
            ]
          }

        processors:
          - label: http
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              let result = this.choices.index(0).message.content.parse_json().catch(null)
              root.reaction = if $result != null { $result } else { null }
        result_map: |
          root.reaction = this.reaction

    - switch:
        - check: 'this.reaction != null'
          processors:
            - log:
                level: INFO
                message: '[🧠 LLM ANALYZED] Link: ${! this.news_link } | Title: ${! this.title_txt} | Reaction: ${! this.reaction.string() }'

output:
  label: load_dds_s_news_reactions
  broker:
    pattern: fan_out
    outputs:
      - label: out_postgres
        sql_raw:
          driver: postgres
          dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
          query: |
            INSERT INTO dds.s_news_reactions (
              news_id, model_nm, reach_idx, impact_scr, duration_days, geoscale_nm, confidence_prt, reason_txt
            ) VALUES (xxh64($1), $2, $3, $4, $5, $6, $7, $8)
            ON CONFLICT (news_id, model_nm) DO UPDATE SET
              _loaded_dttm = now(),
              reach_idx = EXCLUDED.reach_idx,
              impact_scr = EXCLUDED.impact_scr,
              duration_days = EXCLUDED.duration_days,
              geoscale_nm = EXCLUDED.geoscale_nm,
              confidence_prt = EXCLUDED.confidence_prt,
              reason_txt = EXCLUDED.reason_txt;
          args_mapping: |
            root = [
              this.news_link,
              this.model_nm,
              this.reach_idx,
              this.impact_scr,
              this.duration_days,
              this.geoscale_nm,
              this.confidence_prt,
              this.reason_txt
            ]
          batching:
            count: 10
            period: 1s

        processors:
          - mapping: |
              root = if this.reaction == null || this.reaction == ""{ deleted() } else { this }
          - mapping: |
              let model = "deepseek-v4-flash:cloud"
              let reach_allowed = ["1k","10k","100k","1m","10m","100m","1b","10b"]
              let geo_allowed   = ["local","national","regional","global"]
              let reach = this.reaction.reach_idx.string().lowercase().catch("")
              let geo   = this.reaction.geoscale_nm.string().lowercase().catch("")

              root = {
                "news_link": this.news_link.string(),
                "model_nm": $model,
                "reach_idx": if $reach_allowed.contains($reach) { $reach } else { null },
                "impact_scr": this.reaction.impact_scr.number(),
                "duration_days": this.reaction.duration_days.number(),
                "geoscale_nm": if $geo_allowed.contains($geo) { $geo } else { null },
                "confidence_prt": this.reaction.confidence_prt.number(),
                "reason_txt": this.reaction.reason_txt.string().catch("")
              }

      - label: out_redis
        cache:
          target: redis_cache
          key: "processed:dds.s_news_reactions:${! this.news_link.string() }"
        processors:
          - mapping: |
              root = if this.reaction == null { deleted() } else { this }
