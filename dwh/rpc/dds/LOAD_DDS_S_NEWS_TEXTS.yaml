input:
  redpanda:
    seed_brokers: ["dwh-rp-1:9092"]
    topics: ["rss_news_raw"]
    consumer_group: "LOAD_DDS_S_NEWS_TEXTS"

pipeline:
  threads: 1
  processors:
    - label: decode
      schema_registry_decode:
        url: "http://dwh-rp-1:8081"
    - catch:
        - log:
            level: ERROR
            message: "❌ AVRO DECODE FAILED: ${! error() }"
        - mapping: 'root = deleted()'

    # выполнение проверки, была ли новость обработана ранее
    - branch:
        processors:
          - try:
              - label: redis_check_news
                cache:
                  resource: redis_cache
                  operator: exists
                  key: "processed:dds.s_news_texts:${! this.link.string() }"
        result_map: 'meta is_processed = content().string().catch("false")'

    - mapping: |
        root = if meta("is_processed") == "true" { deleted() } else { this }

    # получение из кэша language_code для this.feed_id
    - branch:
        processors:
          - try:
              - label: redis_check_feed
                cache:
                  resource: redis_cache
                  operator: get
                  key: "lookup:dds.r_rss_feeds:${! this.feed_id }"
        result_map: 'root.language_code = content().string().catch("")'

    # сброс флага ошибки от штатного cache-miss (get по отсутствующему ключу), чтобы он не доезжал до avro-catch на выходе out_redpanda
    - catch: []

    # получение из базы (при отсутствии в кэше) значения language_code для this.feed_id
    - branch:
        request_map: |
          root = if this.language_code == null || this.language_code == "" { this } else { deleted() }
        processors:
          - label: postgres_feed
            sql_raw:
              driver: postgres
              dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
              query: "SELECT feed_id, language_code FROM dds.r_rss_feeds WHERE feed_id = $1"
              args_mapping: "root = [this.feed_id]"
          # добавление значения language_code в кэш
          - branch:
              request_map: |
                root = if this.length() > 0 { this } else { deleted() }
              processors:
                - cache:
                    resource: redis_cache
                    operator: set
                    key: 'lookup:dds.r_rss_feeds:${! this.index(0).feed_id.string() }'
                    value: '${! this.index(0).language_code.string() }'
        result_map: 'root.language_code = this.index(0).language_code.catch("unknown")'

    # удаление, если язык не удалось определить
    - mapping: |
        root = if this.language_code == "unknown" || this.language_code == null || this.language_code == "" { deleted() } else { this }

    # получение списка уже существующих переводов для этой новости из БД
    - branch:
        processors:
          - label: postgres_languages
            sql_raw:
              driver: postgres
              dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
              query: "SELECT language_code FROM dds.s_news_texts WHERE news_id = xxh64($1)"
              args_mapping: "root = [this.link.string()]"
        # Сохраняем массив найденных языков (например: ["en", "ru"] или [])
        result_map: |
          root.has_translations = this.map_each(item -> item.language_code).catch([])

    # установка флага необходимости перевода
    - mapping: |
        root = this
        let translations = this.has_translations.or([])
        
        # перевод на EN, если оригинал не EN, язык известен и в БД еще нет перевода 'en'
        root.is_en_translation_needed = this.language_code != "en" && this.language_code != null && !$translations.contains("en")
        
        # перевод на RU, если оригинал не RU, язык известен и в БД еще нет перевода 'ru'
        root.is_ru_translation_needed = this.language_code != "ru" && this.language_code != null && !$translations.contains("ru")

    # выполнение перевода на английский (если необходимо)
    - branch:
        request_map: |
          root = if this.is_en_translation_needed {
            {
              "model": "deepseek-v4-flash",
              "stream": false,
              "temperature": 0.0,
              "top_p": 0.1,
              "response_format": { "type": "json_object" },
              "messages": [
                { "role": "system", "content": "You are a highly skilled professional translator. Your task is to translate ALL text values in the provided JSON object into English. You MUST completely translate BOTH the 'title' and 'summary' into English. NEVER leave any text in the original language. Return ONLY the translated JSON object." },
                { "role": "user",   "content": {"title": this.title, "summary": this.summary}.string() }
              ]
            }
          } else { deleted() }
        processors:
          - label: http_translate_en
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              let result = this.choices.index(0).message.content.parse_json().catch(null)
              root.translated_title = if $result != null { $result.title } else { null }
              root.translated_summary = if $result != null { $result.summary } else { null }
        # объединение оригинала и результата перевода
        result_map: |
          # root - это исходный объект (со всеми полями: id, date, title, summary и т.д.)
          # this - это то, что получилось в конце цепочки processors внутри branch

          root.translated_title_en = this.translated_title
          root.translated_summary_en = this.translated_summary
          # оригинальные поля title и summary при этом не трогаются и остаются в root

    # выполнение перевода на русский (если необходимо)
    - branch:
        request_map: |
          root = if this.is_ru_translation_needed {
            {
              "model": "deepseek-v4-flash",
              "stream": false,
              "temperature": 0.0,
              "top_p": 0.1,
              "response_format": { "type": "json_object" },
              "messages": [
                { "role": "system", "content": "You are a highly skilled professional translator. Your task is to translate ALL text values in the provided JSON object into Russian. You MUST completely translate BOTH the 'title' and 'summary' into Russian. NEVER leave any text in the original language. Return ONLY the translated JSON object." },
                { "role": "user",   "content": {"title": this.title, "summary": this.summary}.string() }
              ]
            }
          } else { deleted() }
        processors:
          - label: http_translate_ru
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              let result = this.choices.index(0).message.content.parse_json().catch(null)
              root.translated_title = if $result != null { $result.title } else { null }
              root.translated_summary = if $result != null { $result.summary } else { null }
        # объединение оригинала и результата перевода
        result_map: |
          # root - это исходный объект (со всеми полями: id, date, title, summary и т.д.)
          # this - это то, что получилось в конце цепочки processors внутри branch

          root.translated_title_ru = this.translated_title
          root.translated_summary_ru = this.translated_summary
          # оригинальные поля title и summary при этом не трогаются и остаются в root

    # логирование результата перевода
    - mapping: |
        let trans_en = this.translated_title_en != null
        let trans_ru = this.translated_title_ru != null

        # Запоминаем в метадату, был ли перевод
        meta is_translated = $trans_en || $trans_ru

        if ($trans_en || $trans_ru) {
          let link = this.link.string()
          let lang = this.language_code.string().or("unknown")
          let log_title = this.title.string()

          let targets = if $trans_en && $trans_ru { "en,ru" } 
                        else if $trans_en { "en" } 
                        else { "ru" }

          let trans_preview = if $trans_en { this.translated_title_en.string() }
                              else { this.translated_title_ru.string() }

          meta log_msg = "[✅ TRANSLATED] Link: %s | %s -> %s | Title: %s | Result: %s".format(
            $link, $lang, $targets, $log_title, $trans_preview
          )
        }

    - switch:
        - check: 'meta("log_msg") != null'
          processors:
            - log:
                level: INFO
                message: '${! meta("log_msg") }'

    # формирование массива [оригинал + перевод]
    - mapping: |
        root = []

        # оригинал
        if this.link != null && this.title != null {
          root = root.append({
            "link": this.link,
            "language_code": this.language_code,
            "title": this.title,
            "summary": this.summary,
            "model_nm": ""
          })
        }

        # перевод EN
        if this.translated_title_en != null && this.translated_summary_en != null {
          root = root.append({
            "link": this.link,
            "language_code": "en",
            "title": this.translated_title_en,
            "summary": this.translated_summary_en,
            "model_nm": "deepseek-v4-flash:cloud"
          })
        }

        # перевод RU
        if this.translated_title_ru != null && this.translated_summary_ru != null {
          root = root.append({
            "link": this.link,
            "language_code": "ru",
            "title": this.translated_title_ru,
            "summary": this.translated_summary_ru,
            "model_nm": "deepseek-v4-flash:cloud"
          })
        }

    # разбиение массива на отдельные сообщения
    - unarchive:
        format: json_array

    # добавление в meta поля key для использования в outputs
    - mapping: |
        meta key = this.link.string().or("")

output:
  label: load_news_translated
  broker:
    pattern: fan_out
    outputs:
      - label: out_postgres
        sql_raw:
          driver: postgres
          dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
          query: |
            INSERT INTO dds.s_news_texts (
              news_id, language_code, title_txt, summary_txt, model_nm
            ) VALUES (xxh64($1), $2, $3, $4, $5)
            ON CONFLICT (news_id, language_code, model_nm) DO NOTHING;
          args_mapping: |
            root = [
              this.link.string().or(""),
              this.language_code.string().or("unknown"),
              this.title.string().or(""),
              this.summary.string().or(""),
              this.model_nm
            ]
          batching:
            count: 5
            period: 1s

      - label: out_redpanda
        redpanda:
          seed_brokers: ["dwh-rp-1:9092"]
          topic: "news_translated"
          key: '${! meta("key") }'
        processors:
          - mapping: |
              root.news_link = this.link.string().or("")
              root.language_code = this.language_code.string().or("unknown")
              root.title_txt = this.title.string().or("")
              root.summary_txt = this.summary.string().or("")
              # Схема берётся из dwh/migrations/<project>/rp и при отсутствии subject'а
              # в registry регистрируется автоматически через schema_metadata
              meta schema = file("/migrations/chronica/rp/news_translated.json").parse_json()
          - try:
              - schema_registry_encode:
                  url: "http://dwh-rp-1:8081"
                  subject: "news_translated-value"
                  schema_metadata: "schema"
                  format: "avro"
                  avro:
                    raw_json: true
          - catch:
              - log:
                  level: ERROR
                  message: "❌ AVRO ENCODE FAILED: ${! error() }"
              - mapping: 'root = deleted()'

      - label: out_redis
        cache:
          target: redis_cache
          key: "processed:dds.s_news_texts:${! this.link.string() }"
