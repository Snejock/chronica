input:
  generate:
    interval: "1m"
    mapping: 'root = {}'

pipeline:
  processors:
    - label: postgres
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          WITH subscribers AS (
              -- получение списка subscriber_id и story_id
              SELECT
                  ss.story_id
                  , ss.subscriber_id
                  , sc.channel_link
                  , sd.language_code
              FROM dds.l_story_subscriber ss
              JOIN dds.s_subscriber_channels sc
                   ON sc.subscriber_id = ss.subscriber_id AND sc.channel_nm = 'telegram'
              LEFT JOIN dds.s_subscriber_details sd
                   ON sd.subscriber_id = ss.subscriber_id
              WHERE ss.is_active = true
          )
          SELECT
              s.channel_link
              , s.subscriber_id
              , s.story_id
              , sunt.story_nm
              , sunt.news_id
              , h.news_link
              , coalesce(nt.title_txt, '')   AS title_txt
              , coalesce(nt.summary_txt, '') AS summary_txt
              , coalesce(sm.image_url, '')   AS image_url
              , s.language_code
          FROM subscribers s
          JOIN bds.b_story_unews_texts sunt
               ON s.story_id = sunt.story_id AND s.language_code = sunt.language_code
          JOIN LATERAL (
              -- оригинал приоритетнее перевода (model_nm = ''), при равенстве - последняя загруженная запись
              SELECT title_txt, summary_txt
              FROM dds.s_news_texts
              WHERE news_id = sunt.news_id AND language_code = sunt.language_code
              ORDER BY (model_nm = '') DESC, _loaded_dttm DESC
              LIMIT 1
          ) nt ON true
          LEFT JOIN dds.s_news_media sm ON sunt.news_id = sm.news_id
          JOIN dds.h_news h ON sunt.news_id = h.news_id
          WHERE NOT EXISTS (
              SELECT 1 FROM dds.t_story_subscriber_news x
              WHERE x.subscriber_id = s.subscriber_id AND x.story_id = s.story_id AND x.news_id = sunt.news_id)
          ORDER BY h.published_dttm
          LIMIT 50

    # empty-array guard before unarchive
    - mapping: |
        root = if this.length() == 0 { deleted() } else { this }

    # unarchive разбивает этот массив на отдельные сообщения
    - unarchive:
        format: json_array

    - mapping: |
        meta key = this.subscriber_id.string() + ":" + this.news_id.string()

output:
  label: load_tg_notifications
  broker:
    pattern: fan_out
    outputs:
      - label: out_redpanda
        redpanda:
          seed_brokers: ["dwh-rp-1:9092"]
          topic: "tg_notifications"
          key: '${! meta("key") }'
        processors:
          - mapping: |
              root.channel_link = this.channel_link.string()
              root.story_id = this.story_id
              root.story_nm = this.story_nm.string().or("")
              root.news_id = this.news_id.string()
              root.news_link = this.news_link.string().or("")
              root.title_txt = this.title_txt.string().or("")
              root.summary_txt = this.summary_txt.string().or("")
              root.image_url = this.image_url.string().or("")
              root.language_code = this.language_code.string().or("ru")
          - try:
            - schema_registry_encode:
                url: "http://dwh-rp-1:8081"
                subject: "tg_notifications-value"
                avro_raw_json: true
          - catch:
            - log:
                level: ERROR
                message: "❌ AVRO ENCODE FAILED: ${! error() }"
            - mapping: 'root = deleted()'

      - label: out_pg_sent
        sql_raw:
          driver: postgres
          dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
          query: |
            INSERT INTO dds.t_story_subscriber_news (subscriber_id, story_id, news_id)
            VALUES ($1, $2, $3)
            ON CONFLICT (subscriber_id, story_id, news_id) DO NOTHING;
          args_mapping: |
            root = [
              this.subscriber_id,
              this.story_id,
              this.news_id.string()
            ]
          batching:
            count: 5
            period: 1s
