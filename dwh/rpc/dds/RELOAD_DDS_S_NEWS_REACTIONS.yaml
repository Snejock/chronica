input:
  generate:
    interval: "5m"
    mapping: 'root = {}'

pipeline:
  threads: 1
  processors:
    - label: postgres
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          SELECT t.news_id, t.title_txt, t.summary_txt
          FROM dds.s_news_texts t
          WHERE t.language_code = 'en'
            AND NOT EXISTS (SELECT 1
                            FROM dds.s_news_reactions r
                            WHERE r.news_id = t.news_id)
          LIMIT 20

    - log:
        level: INFO
        message: '[SQL] Fetched ${! this.length().catch(0) } unprocessed news'

    - mapping: |
        root = if this.type() == "array" && this.length() > 0 { this } else { deleted() }

    - unarchive:
        format: json_array

    - log:
        level: INFO
        message: '[NEWS] news_id=${! this.news_id } | title="${! this.title_txt.string().catch("").slice(0, 80) }"'

    - branch:
        request_map: |
          let system_instruction = """
            You are an expert media analyst and risk assessment specialist.
            Your task is to conduct a deep analysis of the provided news article, evaluate its potential impact across several metrics, and return structured data in JSON format.

            **Important: You must return a JSON object with the following fields:**
            - reach_idx (string) — exponential estimate of the number of people affected by the news (1k, 10k, 100k, 1m, 10m, 100m, 1b, 10b)
            - impact_scr (integer) — strength of the news impact on one person's life (1 — noise, 100 — fundamental changes)
            - duration_days (integer) — projected duration of the news effect in days (1, 7, 30, 90, 180, 365, 3650, 36500)
            - geoscale_nm (string) — geographic scope. Strictly one of the following values:
              * "local" — local impact (city, state, region)
              * "national" — impact within a single country
              * "regional" — impact across multiple countries in one region (e.g., Europe, Middle East)
              * "global" — impact on the entire world
            - confidence_prt (float) — from 0.00 to 1.00. For events that have already occurred = 1.00
            - reason_txt (string) — brief explanation in Russian

            Confidence (confidence_prt) must reflect the probability of the event occurring (if it has not yet happened).
            Use the range from 0.00 to 1.00 with two decimal places.
            For events that have already occurred, use confidence_prt = 1.00.

            Write reason_txt in Russian only.
          """

          let prompt_text = """
            News:
            Title: """ + this.title_txt.or("") + """
            Summary: """ + this.summary_txt.or("") + """

            Task:
            Analyze the news and return a JSON object.

            Before returning the result, verify:
            - The reason_txt field must be written EXCLUSIVELY in Russian.
            - If you wrote reason_txt in Chinese, English, or any other language — rewrite it in Russian.

            Your response (JSON only, no explanations):
          """

          root = {
            "model": "deepseek-v4-flash",
            "stream": false,
            "temperature": 0.6,
            "top_p": 0.9,
            "thinking": { "type": "enabled", "budget_tokens": 4000 },
            "response_format": { "type": "json_object" },
            "messages": [
              { "role": "system", "content": $system_instruction },
              { "role": "user",   "content": $prompt_text }
            ]
          }
        processors:
          - label: http
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              root.reaction = this.choices.index(0).message.content.parse_json().catch(null)
        result_map: |
          root.reaction = this.reaction

    - switch:
        - check: 'this.reaction != null'
          processors:
            - log:
                level: INFO
                message: '[🧠 LLM ANALYZED] news_id=${! this.news_id } | title="${! this.title_txt.string().catch("").slice(0, 80) }" | reaction=${! this.reaction.string() }'

    - mapping: |
        root = if this.reaction == null { deleted() } else { this }

output:
  label: reload_dds_s_news_reactions
  sql_raw:
    driver: postgres
    dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
    query: |
      INSERT INTO dds.s_news_reactions (
        news_id, model_nm, reach_idx, impact_scr, duration_days, geoscale_nm, confidence_prt, reason_txt
      ) VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
      ON CONFLICT (news_id, model_nm) DO NOTHING
    args_mapping: |
      root = [
        this.news_id.string(),
        "deepseek-v4-flash:cloud",
        this.reaction.reach_idx.string(),
        this.reaction.impact_scr.number(),
        this.reaction.duration_days.number(),
        this.reaction.geoscale_nm.string(),
        this.reaction.confidence_prt.number(),
        this.reaction.reason_txt.string().catch("")
      ]
    batching:
      count: 10
      period: 1s