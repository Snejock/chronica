input:
  generate:
    interval: "360m"
    mapping: 'root = {}'

pipeline:
  processors:
    - label: postgres
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          WITH
              news AS (
                SELECT
                    s.story_id,
                    s.story_nm,
                    s.published_dttm,
                    (s.published_dttm AT TIME ZONE 'UTC')::date AS dt,
                    s.language_code,
                    jsonb_strip_nulls(jsonb_build_object(
                        'story_nm', s.story_nm,
                        'news_txt', s.news_txt,
                        'reach_idx', r.reach_idx,
                        'impact_scr', r.impact_scr,
                        'duration_days', r.duration_days,
                        'geoscale_nm', r.geoscale_nm,
                        'confidence_prt', r.confidence_prt,
                        'reason_txt', r.reason_txt)) AS description
                FROM bds.b_story_unews_texts s
                LEFT JOIN LATERAL (
                    SELECT *
                    FROM dds.s_news_reactions
                    WHERE news_id = s.news_id
                    ORDER BY _loaded_dttm DESC
                    LIMIT 1
                ) r ON true
                WHERE s.language_code = 'ru'
                  AND (s.published_dttm AT TIME ZONE 'UTC')::date >= CASE
                        WHEN EXTRACT(HOUR FROM now() AT TIME ZONE 'UTC') < 3
                        THEN current_date - INTERVAL '1' DAY
                        ELSE current_date
                      END
                  AND (s.published_dttm AT TIME ZONE 'UTC')::date <= current_date
              ),
              agg AS (
                SELECT
                    story_id
                    , min(story_nm) AS story_nm
                    , dt
                    , language_code
                    , jsonb_agg(description ORDER BY published_dttm) AS descriptions
                    , max(published_dttm) AS latest_news_dttm
                FROM news
                GROUP BY story_id, dt, language_code
              )
          SELECT
              a.story_id
              , a.story_nm
              , a.dt
              , a.language_code
              , a.descriptions
          FROM agg a
          LEFT JOIN dm.story_summaries_d d
                 ON d.story_id = a.story_id
                AND d.dt = a.dt
                AND d.language_code = a.language_code
                AND d.model_nm = 'deepseek-v4-flash:cloud'
          WHERE d.story_id IS NULL OR a.latest_news_dttm > d._loaded_dttm

    - mapping: |
        root = if this.type() == "array" && this.length() > 0 { this } else { deleted() }

    - unarchive:
        format: json_array

    - branch:
        request_map: |
          let system_instruction = """
            You are a news publication editor.
            Your task is to analyze a list of news for a single day on one topic and return two texts:
            1. A brief headline of the day (headline_txt) — one sentence describing the most important event of the day.
            2. A coherent paragraph (summary_txt) — 3-5 sentences summarizing all key events of the day on this topic.

            News is always present. Even if there are few articles or impact data is missing — rely on the news_txt field and compose the summary based on the available data.
            When prioritizing emphasis, consider the fields reach_idx (reach scale), impact_scr (impact strength, -100..+100), duration_days (effect duration in days), geoscale_nm (geographic scale of the news impact), confidence_prt (confidence in the event occurring, 0.00 to 1.00) — if present.

            Return strictly a JSON object with the fields headline_txt and summary_txt.
            Respond in Russian language only.
          """

          let prompt_text = """
            Story: """ + this.story_nm.string() + """
            Date: """ + this.dt.string() + """

            News for the day:
            """ + this.descriptions.string() + """

            Your response (JSON only, no explanations):
          """

          root = {
            "model": "deepseek-v4-flash",
            "stream": false,
            "temperature": 0.3,
            "top_p": 0.9,
            "response_format": { "type": "json_object" },
            "messages": [
              { "role": "system", "content": $system_instruction },
              { "role": "user",   "content": $prompt_text }
            ]
          }
        processors:
          - label: http
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              let result = this.choices.index(0).message.content.parse_json().catch(null)
              root.ai_response = if $result != null { $result } else { null }
        result_map: |
          root.ai_response = this.ai_response

    - switch:
        - check: 'this.ai_response != null'
          processors:
            - log:
                level: INFO
                message: '[🧠 LLM ANALYZED] Link: ${! this.story_id } | Headline: ${! this.ai_response.headline_txt} | Summary: ${! this.ai_response.summary_txt.string() }'

output:
  label: load_dm_story_summaries_d
  sql_raw:
    driver: postgres
    dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
    query: |
      INSERT INTO dm.story_summaries_d (
        story_id, dt, model_nm, language_code, headline_txt, summary_txt
      ) VALUES ($1, $2, $3, $4, $5, $6)
      ON CONFLICT (story_id, dt, model_nm, language_code) DO UPDATE SET
        _loaded_dttm = now(),
        headline_txt = EXCLUDED.headline_txt,
        summary_txt = EXCLUDED.summary_txt
    args_mapping: |
      root = [
        this.story_id,
        this.dt,
        "deepseek-v4-flash:cloud",
        this.language_code,
        this.headline_txt,
        this.summary_txt
      ]
    batching:
      count: 10
      period: 1s

  processors:
    - mapping: |
        root = if this.ai_response == null || this.ai_response == ""{ deleted() } else { this }
    - mapping: |
        let model = "deepseek-v4-flash:cloud"

        root = {
          "story_id": this.story_id.number(),
          "dt": this.dt,
          "language_code": this.language_code.string(),
          "headline_txt": this.ai_response.headline_txt.string(),
          "summary_txt": this.ai_response.summary_txt.string(),
          "model_nm": $model
        }
