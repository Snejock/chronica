input:
  generate:
    interval: "20m"
    mapping: 'root = {}'

pipeline:
  threads: 1
  processors:
    # удаление зависших неактивных строк, у которых уже есть активная пара
    - label: cleanup_inactive
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          DELETE FROM dm.story_briefs b
          WHERE b.is_active = false
            AND EXISTS (
                SELECT 1 FROM dm.story_briefs a
                WHERE a.story_id = b.story_id
                  AND a.model_nm = b.model_nm
                  AND a.language_code = b.language_code
                  AND a.is_active = true
            )

    # деактивировать брифы сюжетов без сводок за последние 7 дней
    # влияет на отображение на фронте брифа для конкретного сюжета
    - label: deactivate_stale
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          UPDATE dm.story_briefs b
          SET is_active = false, _loaded_dttm = now()
          WHERE b.is_active = true
            AND NOT EXISTS (
                SELECT 1 FROM dm.story_summaries_d s
                WHERE s.story_id = b.story_id
                  AND s.language_code = b.language_code
                  AND s.dt >= current_date - INTERVAL '6 day'
            )

    # выбор сюжетов со сводками за последние 7 дней, у которых появилась сводка новее,
    # чем последняя генерация активного брифа (иначе LLM пересчитывает один и тот же
    # 7-дневный контекст на каждый тик, даже если по сюжету давно ничего не изменилось)
    - label: postgres
      sql_raw:
        driver: postgres
        dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
        query: |
          WITH recent AS (
              SELECT story_id, language_code, dt, headline_txt, summary_txt, _loaded_dttm
              FROM dm.story_summaries_d
              WHERE language_code = 'ru'
                AND dt >= current_date - INTERVAL '6 day'
          ),
          aggregated AS (
              SELECT
                  r.story_id,
                  min(d.story_nm) AS story_nm,
                  r.language_code,
                  min(r.dt) AS coverage_from_dt,
                  max(r.dt) AS coverage_to_dt,
                  max(r._loaded_dttm) AS latest_summary_dttm,
                  jsonb_agg(jsonb_build_object(
                      'dt', r.dt,
                      'headline_txt', r.headline_txt,
                      'summary_txt', r.summary_txt
                  ) ORDER BY r.dt) AS days
              FROM recent r
              LEFT JOIN dds.s_story_details d
                     ON d.story_id = r.story_id AND d.language_code = r.language_code
              GROUP BY r.story_id, r.language_code
          )
          SELECT a.story_id, a.story_nm, a.language_code, a.coverage_from_dt, a.coverage_to_dt, a.days
          FROM aggregated a
          WHERE NOT EXISTS (
              SELECT 1 FROM dm.story_briefs b
              WHERE b.story_id = a.story_id
                AND b.language_code = a.language_code
                AND b._loaded_dttm >= a.latest_summary_dttm
          )

    # guard + разворот батча
    - mapping: |
        root = if this.type() == "array" && this.length() > 0 { this } else { deleted() }

    - unarchive:
        format: json_array

    # вызов LLM
    - branch:
        request_map: |
          let system_instruction = """
            You are a professional journalist and analyst.
            You are given daily summaries of a single news story, ordered chronologically.
            Your task is to produce two texts:
            1. lead_txt — a short, punchy newspaper-style headline (3-8 words). It must be strictly objective and unbiased: state the fact, not an opinion. No clickbait, no emotional coloring, no evaluative adjectives. Think Reuters/AP headline style.
            2. brief_txt — a coherent paragraph (4-6 sentences) that summarizes the CURRENT STATE of the story: what is happening now and where things stand. This is a status summary for a reader catching up, not a chronological recap.
               - Lead with the latest and most important development, not with how much time has passed.
               - Never open with, or otherwise mention, the time span covered (e.g. "За N дней...", "В течение недели...", "На протяжении..."). The reader does not need to know how many days are summarized.
               - Mention earlier events only as brief context for the current state, not as a day-by-day account.
               Write in a professional, analytical tone.

            Return strictly a JSON object with fields lead_txt and brief_txt.
            Respond in Russian language only.
          """

          let prompt_text = """
            Story: """ + this.story_nm.string().or("Unknown") + """
            Last updated: """ + this.coverage_to_dt.string() + """

            Daily summaries (chronological):
            """ + this.days.string() + """

            Your response (JSON only, no explanations):
          """

          root = {
            "model": "deepseek-v4-flash",
            "stream": false,
            "temperature": 0.4,
            "top_p": 0.9,
            "response_format": { "type": "json_object" },
            "messages": [
              { "role": "system", "content": $system_instruction },
              { "role": "user",   "content": $prompt_text }
            ]
          }
        processors:
          - label: http
            http:
              url: "https://api.deepseek.com/chat/completions"
              verb: POST
              headers:
                Content-Type: "application/json"
                Authorization: "Bearer ${DEEPSEEK_API_KEY}"
              timeout: 3m
              retries: 3
              retry_period: "5s"
          - catch:
              - log:
                  level: WARN
                  message: "❌ LLM API failed after retries: ${! error() }"
          - mapping: |
              let result = this.choices.index(0).message.content.parse_json().catch(null)
              root.ai_response = if $result != null { $result } else { null }
        result_map: |
          root.ai_response = this.ai_response

    # логирование
    - switch:
        - check: 'this.ai_response != null'
          processors:
            - log:
                level: INFO
                message: '[🧠 LLM BRIEF] story_id: ${! this.story_id } | Lead: ${! this.ai_response.lead_txt}'

output:
  label: load_dm_story_briefs
  sql_raw:
    driver: postgres
    dsn: postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DATABASE}?sslmode=disable
    query: |
      INSERT INTO dm.story_briefs (
        story_id, model_nm, language_code, lead_txt, brief_txt,
        coverage_from_dt, coverage_to_dt, is_active
      ) VALUES ($1, $2, $3, $4, $5, $6, $7, true)
      ON CONFLICT (story_id, model_nm, language_code, is_active) DO UPDATE SET
        _loaded_dttm     = now(),
        lead_txt         = EXCLUDED.lead_txt,
        brief_txt        = EXCLUDED.brief_txt,
        coverage_from_dt = EXCLUDED.coverage_from_dt,
        coverage_to_dt   = EXCLUDED.coverage_to_dt
    args_mapping: |
      root = [
        this.story_id,
        "deepseek-v4-flash:cloud",
        this.language_code,
        this.lead_txt,
        this.brief_txt,
        this.coverage_from_dt,
        this.coverage_to_dt
      ]
    batching:
      count: 10
      period: 1s

  processors:
    - mapping: |
        root = if this.ai_response == null || this.ai_response == "" { deleted() } else { this }
    - mapping: |
        root = {
          "story_id": this.story_id.number(),
          "language_code": this.language_code.string(),
          "lead_txt": this.ai_response.lead_txt.string(),
          "brief_txt": this.ai_response.brief_txt.string(),
          "coverage_from_dt": this.coverage_from_dt,
          "coverage_to_dt": this.coverage_to_dt
        }